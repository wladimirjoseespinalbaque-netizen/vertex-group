<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Vertex Store</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <header class="header-tienda">
        <div class="logo">
            <a href="../index.html" style="text-decoration:none; color:#111;">
                <span style="color:#0056b3; font-weight:900;">V</span>ERTEX <span style="color:#666; font-weight:300;">STORE</span>
            </a>
        </div>
        <nav>
            <a href="index.html">← Volver a la Tienda</a>
        </nav>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h2 id="titulo-auth">Iniciar Sesión</h2>

            <!-- LETRERO DE ERROR ELEGANTE (Oculto por defecto) -->
            <div id="mensaje-error" class="error-box"></div>

            <!-- Botón de Google -->
            <button id="btn-google" class="btn-google">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Continuar con Google
            </button>

            <div class="divisor">
                <span>O ingresa con tu correo</span>
            </div>

            <form id="form-auth">
                <div class="form-group">
                    <label>Correo Electrónico:</label>
                    <input type="email" id="email" required placeholder="Ej: correo@ejemplo.com">
                </div>
                <div class="form-group">
                    <label>Contraseña:</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" required placeholder="Mínimo 6 caracteres">
                        <button type="button" id="toggle-password" class="btn-toggle-password">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn-pagar" id="btn-submit">Entrar</button>
            </form>

            <p class="toggle-auth">
                <span id="texto-toggle">¿No tienes cuenta?</span>
                <a href="#" id="link-toggle">Regístrate aquí</a>
            </p>
        </div>
    </div>

    <!-- Script de Autenticación -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAixgfedj6V6IQFTg8oU1uDPoKccIYwVc4",
            authDomain: "vertex-store-a3b93.firebaseapp.com",
            projectId: "vertex-store-a3b93",
            storageBucket: "vertex-store-a3b93.firebasestorage.app",
            messagingSenderId: "160958489434",
            appId: "1:160958489434:web:51573d5d8e1ba43aa14963"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const errorBox = document.getElementById('mensaje-error');
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('toggle-password');

        // Ocultar el error cuando el usuario empieza a escribir
        document.getElementById('email').addEventListener('input', () => errorBox.style.display = 'none');
        passwordInput.addEventListener('input', () => errorBox.style.display = 'none');

        // Lógica para mostrar/ocultar contraseña (El ojito)
        toggleBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.innerText = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleBtn.innerText = '👁️';
            }
        });

        // Si ya está logueado, lo mandamos a la tienda
        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = "index.html";
        });

        // Lógica para mostrar Login o Registro
        let esRegistro = false;
        const titulo = document.getElementById('titulo-auth');
        const btnSubmit = document.getElementById('btn-submit');
        const textoToggle = document.getElementById('texto-toggle');
        const linkToggle = document.getElementById('link-toggle');

        linkToggle.addEventListener('click', (e) => {
            e.preventDefault();
            errorBox.style.display = 'none'; // Limpiar errores al cambiar de modo
            esRegistro = !esRegistro;
            if (esRegistro) {
                titulo.innerText = "Crear Cuenta";
                btnSubmit.innerText = "Registrarme";
                textoToggle.innerText = "¿Ya tienes cuenta?";
                linkToggle.innerText = "Inicia sesión";
            } else {
                titulo.innerText = "Iniciar Sesión";
                btnSubmit.innerText = "Entrar";
                textoToggle.innerText = "¿No tienes cuenta?";
                linkToggle.innerText = "Regístrate aquí";
            }
        });

        // Login con Google (Ocultando el error feo si cierran la ventana)
        document.getElementById('btn-google').addEventListener('click', () => {
            signInWithPopup(auth, provider).catch(error => {
                if (error.code !== 'auth/popup-closed-by-user') {
                    mostrarError("Hubo un problema con Google. Intenta de nuevo.");
                }
            });
        });

        // Login/Registro con Email
        document.getElementById('form-auth').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (esRegistro) {
                createUserWithEmailAndPassword(auth, email, password)
                    .then(() => window.location.href = "index.html")
                    .catch(error => {
                        if (error.code === 'auth/email-already-in-use') {
                            mostrarError("Este correo ya está registrado. Por favor, inicia sesión.");
                        } else if (error.code === 'auth/weak-password') {
                            mostrarError("La contraseña es muy débil. Debe tener al menos 6 caracteres.");
                        } else {
                            mostrarError("Error al registrar: " + error.message);
                        }
                    });
            } else {
                signInWithEmailAndPassword(auth, email, password)
                    .then(() => window.location.href = "index.html")
                    .catch(error => {
                        // Firebase usa 'auth/invalid-credential' para correo no existe o mala contraseña
                        if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                            mostrarError("Correo o contraseña incorrectos. Si no tienes cuenta, regístrate primero.");
                        } else {
                            mostrarError("Error al iniciar sesión. Intenta de nuevo.");
                        }
                    });
            }
        });

        // Función para pintar el letrero de error bonito
        function mostrarError(mensaje) {
            errorBox.innerHTML = `<strong>¡Ups!</strong> ${mensaje}`;
            errorBox.style.display = 'block';
        }
    </script>
</body>
</html>
