<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra | Vertex Store</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <header class="header-tienda">
        <div class="logo">
            <a href="../index.html" style="text-decoration:none; color:#111;">
                <span style="color:#0056b3; font-weight:900;">V</span>ERTEX <span style="color:#666; font-weight:300;">STORE</span>
            </a>
        </div>
        <nav>
            <a href="index.html">← Volver a la Tienda</a>
        </nav>
    </header>

    <div class="checkout-container">
        <h2>Finalizar Pedido</h2>

        <form action="https://notificador-vertex.wladimirjoseespinalbaque.workers.dev" method="POST" id="form-compra">
            <!-- CAMPOS OCULTOS DEL PRODUCTO -->
            <input type="hidden" name="Producto" id="input-producto" value="">
            <input type="hidden" name="Precio" id="input-precio" value="">

            <div class="form-group">
                <label>Nombre Completo:</label>
                <input type="text" name="Nombre" required placeholder="Ej: Juan Pérez">
            </div>

            <div class="form-group">
                <label>Teléfono / WhatsApp:</label>
                <input type="tel" name="Telefono" required placeholder="Ej: 0991234567">
            </div>

            <div class="form-group">
                <label>Dirección de Envío (Ciudad y Sector):</label>
                <input type="text" name="Direccion" required placeholder="Ej: Guayaquil, Sauces 9">
            </div>

            <div class="form-group">
                <label>Método de Pago:</label>
                <select name="Metodo_Pago" required>
                    <option value="Transferencia Bancaria">Transferencia Bancaria</option>
                    <option value="Deuna">Deuna</option>
                    <option value="Efectivo (Contra entrega)">Efectivo (Contra entrega)</option>
                </select>
            </div>

            <button type="submit" class="btn-pagar">Confirmar Pedido</button>
        </form>
    </div>

    <script src="store.js"></script>
</body>
</html>
